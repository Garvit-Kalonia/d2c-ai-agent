<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2C AI Operations Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div class="brand-text">
                <span class="brand-name">D2C AI Operations Agent</span>
                <span class="brand-status">
                    <span class="status-dot"></span>
                    Local AI
                </span>
            </div>
        </div>
    </header>

    <main id="chat" class="chat"></main>

    <div class="composer-area">
        <div class="composer">
            <textarea
                id="messageInput"
                placeholder="Message the agent..."
                rows="1"
            ></textarea>

            <button id="sendButton" class="send-button" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        function generateSessionId() {
            if (
                typeof crypto !== "undefined" &&
                typeof crypto.randomUUID === "function"
            ) {
                return crypto.randomUUID();
            }

            return (
                "session-" +
                Math.random().toString(36).substring(2, 11) +
                Date.now().toString(36)
            );
        }

        const sessionId = generateSessionId();

        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatArguments(argumentsObject) {
            if (!argumentsObject) return "";

            try {
                return JSON.stringify(argumentsObject, null, 2);
            } catch {
                return String(argumentsObject);
            }
        }

        function addUserMessage(message) {
            const wrapper = document.createElement("div");
            wrapper.className = "message user-message";

            const bubble = document.createElement("div");
            bubble.className = "user-bubble";
            bubble.textContent = message;

            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);

            scrollToBottom();
        }

        function showThinking() {
            const wrapper = document.createElement("div");
            wrapper.className = "message assistant-message thinking-message";
            wrapper.id = "thinking-message";

            const body = document.createElement("div");
            body.className = "assistant-body";

            const header = document.createElement("div");
            header.className = "assistant-header";

            const avatar = document.createElement("div");
            avatar.className = "assistant-avatar";
            avatar.textContent = "✦";

            const name = document.createElement("span");
            name.className = "assistant-name";
            name.textContent = "D2C Agent";

            const thinking = document.createElement("span");
            thinking.className = "thinking";
            thinking.textContent = "Thinking...";

            header.appendChild(avatar);
            header.appendChild(name);
            header.appendChild(thinking);

            body.appendChild(header);

            wrapper.appendChild(body);
            chat.appendChild(wrapper);

            scrollToBottom();
        }

        function removeThinking() {
            const thinking = document.getElementById("thinking-message");

            if (thinking) {
                thinking.remove();
            }
        }

        function buildProcessContent(activity) {
            if (!activity || activity.length === 0) {
                return `
                    <div class="process-empty">
                        No tools were used for this request.
                    </div>
                `;
            }

            let html = "";

            for (const step of activity) {
                if (step.type === "tool_call") {
                    html += `
                        <div class="process-step">
                            <div class="process-label">TOOL CALL</div>
                            <div class="process-tool-name">
                                ${escapeHtml(step.name)}
                            </div>
                            <pre>${escapeHtml(
                                formatArguments(step.arguments)
                            )}</pre>
                        </div>
                    `;
                }

                if (step.type === "tool_result") {
                    let resultText = step.result;

                    if (typeof resultText !== "string") {
                        try {
                            resultText = JSON.stringify(
                                resultText,
                                null,
                                2
                            );
                        } catch {
                            resultText = String(resultText);
                        }
                    }

                    html += `
                        <div class="process-step">
                            <div class="process-label">RESULT</div>
                            <div class="process-tool-name">
                                ${escapeHtml(step.name)}
                            </div>
                            <pre>${escapeHtml(resultText)}</pre>
                        </div>
                    `;
                }
            }

            return html;
        }

        function addAssistantMessage(
            response,
            activity,
            iterations,
            completed
        ) {
            const wrapper = document.createElement("div");
            wrapper.className = "message assistant-message";

            const body = document.createElement("div");
            body.className = "assistant-body";

            const header = document.createElement("div");
            header.className = "assistant-header";

            const avatar = document.createElement("div");
            avatar.className = "assistant-avatar";
            avatar.textContent = "✦";

            const name = document.createElement("span");
            name.className = "assistant-name";
            name.textContent = "D2C Agent";

            header.appendChild(avatar);
            header.appendChild(name);

            /*
             * Always show Process details.
             *
             * This is useful even when the agent did not call any tools,
             * because it lets us see that the response came directly
             * from the model rather than from a tool-backed operation.
             */
            const processBtn = document.createElement("button");
            processBtn.className = "process-button";
            processBtn.type = "button";
            processBtn.innerHTML = `
                <span class="process-chevron">›</span>
                <span>Process details</span>
            `;

            const processPanel = document.createElement("div");
            processPanel.className = "process-panel";

            processPanel.innerHTML = `
                <div class="process-inner">
                    ${buildProcessContent(activity)}
                    <div class="process-footer">
                        <span>
                            ${iterations}
                            iteration${iterations === 1 ? "" : "s"}
                        </span>
                        <span class="process-completed">
                            ${completed ? "Completed" : "Stopped"}
                        </span>
                    </div>
                </div>
            `;

            processBtn.addEventListener("click", () => {
                const isOpen = body.classList.toggle("process-open");

                processBtn.setAttribute(
                    "aria-expanded",
                    isOpen ? "true" : "false"
                );

                scrollToBottom();
            });

            header.appendChild(processBtn);

            const content = document.createElement("div");
            content.className = "assistant-content";
            content.textContent = response;

            body.appendChild(header);
            body.appendChild(processPanel);
            body.appendChild(content);

            wrapper.appendChild(body);

            chat.appendChild(wrapper);

            scrollToBottom();
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message) return;

            input.value = "";
            input.style.height = "24px";
            sendButton.disabled = true;

            addUserMessage(message);
            showThinking();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(
                        `Request failed: ${response.status}`
                    );
                }

                const data = await response.json();

                removeThinking();

                addAssistantMessage(
                    data.response,
                    data.agent_steps || [],
                    data.iterations || 0,
                    data.completed
                );
            } catch (error) {
                removeThinking();

                addAssistantMessage(
                    "Something went wrong while contacting the agent.",
                    [],
                    0,
                    false
                );

                console.error(error);
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        sendButton.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height =
                Math.min(input.scrollHeight, 160) + "px";
        });

        input.focus();
    </script>
</body>
</html>
